<nav class="navbar navbar-expand-lg navbar-dark sticky-top" [class.is-open]="!isCollapsed">
  <div class="container">
    <!-- Logo -->
    <a class="navbar-brand" routerLink="/" (click)="closeNav()">
      <img src="logo-k2k.svg" alt="K2K SRL" height="42">
    </a>

    <!-- Menu mobile -->
    <button class="nav-burger d-lg-none" type="button" (click)="toggleNav()"
            [attr.aria-expanded]="!isCollapsed" aria-controls="navbarNav"
            [attr.aria-label]="isCollapsed ? 'Apri il menu' : 'Chiudi il menu'">
      <span></span><span></span><span></span>
    </button>

    <!-- Nav links -->
    <div class="navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        @for (link of links; track link.path; let i = $index) {
          <li class="nav-item" [style.--i]="i">
            <a class="nav-link" [routerLink]="link.path" routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: link.path === '/' }" (click)="closeNav()">{{ link.label }}</a>
          </li>
        }
        <li class="nav-item nav-item--cta" [style.--i]="links.length">
          <a class="btn btn-k2k btn-sm" routerLink="/contatti" (click)="closeNav()">
            <i class="bi bi-calendar-check me-2"></i>Appuntamento
          </a>
        </li>
      </ul>
    </div>
  </div>

  <!-- Avanzamento lettura: striscia di vernice -->
  <div class="nav-paint" aria-hidden="true"></div>
</nav>
