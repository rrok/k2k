<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f8fa"/>
      <stop offset="0.42" stop-color="#bfc6cd"/>
      <stop offset="0.55" stop-color="#7f8891"/>
      <stop offset="1" stop-color="#d9dee2"/>
    </linearGradient>
    <linearGradient id="steelH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#858e96"/>
      <stop offset="0.3" stop-color="#f1f4f6"/>
      <stop offset="0.6" stop-color="#c3c9cf"/>
      <stop offset="1" stop-color="#737c84"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5056"/>
      <stop offset="1" stop-color="#1b1e21"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a26"/>
      <stop offset="0.4" stop-color="#e3c26e"/>
      <stop offset="1" stop-color="#7d5f20"/>
    </linearGradient>
  </defs>

  <!-- tubo aria -->
  <path d="M154 204 C156 214 166 219 186 219" stroke="#26292d" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- serbatoio a gravità -->
  <rect x="94" y="4" width="62" height="11" rx="4" fill="url(#steelH)" stroke="#59616a" stroke-width="1.5"/>
  <path d="M99 15 H151 L146 70 Q125 79 104 70 Z" fill="url(#steelH)" stroke="#59616a" stroke-width="1.5"/>
  <path d="M108 22 L112 64" stroke="#ffffff" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round"/>
  <rect x="114" y="70" width="22" height="22" fill="url(#steelH)" stroke="#59616a" stroke-width="1.5"/>

  <!-- regolazioni posteriori -->
  <rect x="158" y="78" width="13" height="14" rx="2" fill="url(#dark)"/>
  <rect x="176" y="97" width="18" height="14" rx="3" fill="url(#dark)"/>
  <rect x="190" y="99" width="6" height="10" rx="2" fill="#2f9e6a"/>

  <!-- corpo -->
  <path d="M34 92 H168 Q180 92 180 104 Q180 118 168 118 H34 Z" fill="url(#steel)" stroke="#59616a" stroke-width="1.5"/>
  <path d="M40 97 H166" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- grilletto -->
  <path d="M94 118 Q84 150 101 184 Q108 187 111 181 Q98 152 107 118 Z" fill="url(#steelH)" stroke="#59616a" stroke-width="1.5"/>

  <!-- impugnatura -->
  <path d="M128 116 H164 L170 196 Q160 207 146 201 Z" fill="url(#steelH)" stroke="#59616a" stroke-width="1.5"/>
  <path d="M136 124 L148 196" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
  <rect x="143" y="196" width="22" height="11" rx="3" fill="url(#brass)"/>

  <!-- cappello aria e ugello -->
  <rect x="17" y="83" width="9" height="10" rx="2" fill="url(#steel)" stroke="#59616a"/>
  <rect x="17" y="115" width="9" height="10" rx="2" fill="url(#steel)" stroke="#59616a"/>
  <rect x="21" y="89" width="17" height="30" rx="4" fill="url(#steel)" stroke="#59616a" stroke-width="1.5"/>
  <path d="M21 96 L10 100.5 V107.5 L21 112 Z" fill="#cfd5da" stroke="#59616a" stroke-width="1.2"/>
  <circle cx="9" cy="104" r="3.2" fill="#c8102e"/>
</svg>
