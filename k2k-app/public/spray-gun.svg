<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Aerografo a gravità. L'ugello è in (9,104), l'impugnatura passa per (148,150): il codice conta su questi punti. -->
  <defs>
    <linearGradient id="barrel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".16" stop-color="#dfe4e8"/>
      <stop offset=".44" stop-color="#939ca5"/>
      <stop offset=".6" stop-color="#59626b"/>
      <stop offset=".8" stop-color="#b4bcc3"/>
      <stop offset="1" stop-color="#eef1f3"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#68717b"/>
      <stop offset=".2" stop-color="#f8fafb"/>
      <stop offset=".4" stop-color="#cbd2d8"/>
      <stop offset=".68" stop-color="#7a838c"/>
      <stop offset=".88" stop-color="#c5ccd2"/>
      <stop offset="1" stop-color="#59626b"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f8891"/>
      <stop offset=".18" stop-color="#f5f7f8"/>
      <stop offset=".36" stop-color="#d9dee2"/>
      <stop offset=".66" stop-color="#8d969e"/>
      <stop offset=".86" stop-color="#c2c9cf"/>
      <stop offset="1" stop-color="#6b747d"/>
    </linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6067"/>
      <stop offset=".35" stop-color="#23262a"/>
      <stop offset="1" stop-color="#0c0d0f"/>
    </linearGradient>
    <linearGradient id="blackH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14161a"/>
      <stop offset=".3" stop-color="#4d535a"/>
      <stop offset=".6" stop-color="#1c1f23"/>
      <stop offset="1" stop-color="#0a0b0d"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7d8d"/>
      <stop offset=".3" stop-color="#e01c3b"/>
      <stop offset=".62" stop-color="#8d0b21"/>
      <stop offset="1" stop-color="#d21534"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5d1f"/>
      <stop offset=".35" stop-color="#f0d488"/>
      <stop offset=".65" stop-color="#b98f39"/>
      <stop offset="1" stop-color="#6f531b"/>
    </linearGradient>
    <radialGradient id="dial" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d5dade"/>
    </radialGradient>
  </defs>

  <!-- tubo dell'aria -->
  <path d="M153 207 C155 216 166 219 198 219" stroke="#0f1113" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M155 208 C158 214 168 216.5 196 216.5" stroke="#4a4f55" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- manometro -->
  <rect x="163" y="188" width="9" height="6" fill="url(#brass)"/>
  <circle cx="182" cy="188" r="13.5" fill="url(#black)"/>
  <circle cx="182" cy="188" r="10.6" fill="url(#dial)"/>
  <path d="M175.6 193.2 A8.2 8.2 0 1 1 188.4 193.2" fill="none" stroke="#2a2d31" stroke-width="1.1" stroke-dasharray="1 2.1"/>
  <path d="M186.2 181.6 A8.2 8.2 0 0 1 188.4 193.2" fill="none" stroke="#e01c3b" stroke-width="1.6"/>
  <path d="M182 188 L177.4 182.4" stroke="#c8102e" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="182" cy="188" r="1.7" fill="#16181b"/>

  <!-- impugnatura -->
  <path d="M124 113 H161 C167 142 169 172 165 199 H142 C141 170 134 140 124 113 Z" fill="url(#tube)" stroke="#48515a" stroke-width="1.2"/>
  <path d="M133 124 H154 C158 148 159 170 157 190 H147 C146 166 141 144 133 124 Z" fill="url(#blackH)"/>
  <g stroke="#ffffff" stroke-opacity=".12" stroke-width="1">
    <path d="M136 132 H155.4"/><path d="M138.6 140 H156.6"/><path d="M140.8 148 H157.4"/><path d="M142.6 156 H158"/>
    <path d="M144 164 H158.2"/><path d="M145 172 H158.2"/><path d="M145.8 180 H157.8"/>
  </g>
  <!-- raccordo dell'aria -->
  <rect x="141" y="198" width="25" height="6" rx="1.5" fill="url(#tube)" stroke="#48515a" stroke-width=".8"/>
  <rect x="143" y="203.5" width="21" height="8" rx="1.5" fill="url(#brass)"/>
  <path d="M148.5 203.5 V211.5 M158.5 203.5 V211.5" stroke="#5f4715" stroke-width=".8"/>

  <!-- grilletto -->
  <path d="M97 112 C88 142 91 168 103 189 C107 194 114 192 112 186 C103 166 101 144 109 114 Z" fill="url(#tube)" stroke="#48515a" stroke-width="1.2"/>
  <path d="M101 122 C96 144 97 162 104 178" stroke="#ffffff" stroke-opacity=".75" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="104" cy="112" r="3.4" fill="#2a2d31"/>
  <circle cx="104" cy="112" r="1.4" fill="#aeb5bc"/>

  <!-- attacco e tazza -->
  <rect x="113" y="72" width="22" height="20" fill="url(#tube)" stroke="#48515a" stroke-width="1"/>
  <rect x="110" y="68" width="28" height="7" rx="2" fill="url(#blackH)"/>
  <path d="M114 68 V75 M119 68 V75 M124 68 V75 M129 68 V75 M134 68 V75" stroke="#ffffff" stroke-opacity=".16" stroke-width="1"/>
  <path d="M98 15 H150 L144 62 C142 67 137 69 131 69 H117 C111 69 106 67 104 62 Z" fill="url(#cup)" stroke="#48515a" stroke-width="1.2"/>
  <path d="M99.6 28 H148.4 L146.9 40 H101.1 Z" fill="url(#red)"/>
  <text x="124" y="37.6" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="8.6" fill="#ffffff" letter-spacing=".6">K2K</text>
  <path d="M107 19 L111 61" stroke="#ffffff" stroke-opacity=".85" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M141 20 L138 60" stroke="#000000" stroke-opacity=".14" stroke-width="5" stroke-linecap="round"/>
  <rect x="93" y="5" width="62" height="12" rx="4.5" fill="url(#black)"/>
  <rect x="96" y="6.5" width="56" height="2.4" rx="1.2" fill="#ffffff" fill-opacity=".22"/>
  <rect x="120.5" y="1" width="7" height="6" rx="2" fill="url(#black)"/>

  <!-- regolazioni: ventaglio (sopra) e ago (dietro) -->
  <rect x="150" y="76" width="16" height="16" rx="3" fill="url(#black)"/>
  <path d="M153.5 77 V91 M157 77 V91 M160.5 77 V91 M164 77 V91" stroke="#ffffff" stroke-opacity=".2" stroke-width="1"/>
  <rect x="170" y="95" width="19" height="18" rx="3" fill="url(#black)"/>
  <path d="M173.5 96 V112 M177 96 V112 M180.5 96 V112 M184 96 V112" stroke="#ffffff" stroke-opacity=".2" stroke-width="1"/>
  <rect x="188" y="98.5" width="7" height="11" rx="2.5" fill="url(#red)"/>

  <!-- corpo -->
  <path d="M36 90 H156 C166 90 172 96 172 104 C172 112 166 118 156 118 H36 Z" fill="url(#barrel)" stroke="#48515a" stroke-width="1.2"/>
  <path d="M92 90 L98 82 H150 L156 90 Z" fill="url(#barrel)" stroke="#48515a" stroke-width="1.2"/>
  <path d="M42 94.5 H160" stroke="#ffffff" stroke-opacity=".9" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M64 90 V118" stroke="#3d454d" stroke-opacity=".55" stroke-width="1"/>
  <path d="M66 90 V118" stroke="#ffffff" stroke-opacity=".5" stroke-width="1"/>
  <text x="112" y="108" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="7" fill="#2f363d" fill-opacity=".6" letter-spacing="1.4">HVLP</text>

  <!-- testina: ghiera rossa zigrinata, cappello dell'aria con le corna, ugello -->
  <rect x="26" y="85" width="15" height="38" rx="3.5" fill="url(#red)" stroke="#5c0715" stroke-width="1"/>
  <path d="M29.5 86 V122 M33 86 V122 M36.5 86 V122" stroke="#ffffff" stroke-opacity=".28" stroke-width="1"/>
  <path d="M26 89 L15 95 V113 L26 119 Z" fill="url(#barrel)" stroke="#48515a" stroke-width="1"/>
  <rect x="9" y="82" width="12" height="11" rx="2.5" fill="url(#barrel)" stroke="#48515a" stroke-width="1"/>
  <rect x="9" y="115" width="12" height="11" rx="2.5" fill="url(#barrel)" stroke="#48515a" stroke-width="1"/>
  <circle cx="13" cy="87.5" r="1.3" fill="#1b1e21"/>
  <circle cx="13" cy="120.5" r="1.3" fill="#1b1e21"/>
  <rect x="8" y="100" width="9" height="8" rx="2" fill="url(#brass)" stroke="#5f4715" stroke-width=".8"/>
  <circle cx="9" cy="104" r="1.9" fill="#16181b"/>
</svg>
